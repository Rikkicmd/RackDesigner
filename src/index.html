<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b7a75">
<meta name="description" content="Design server racks, allocate switch, patch panel and device ports, and export the port allocation table and rack layout. Works offline.">
<title>Rack Designer</title>
<style>/*@CSS@*/</style>
</head>
<body>
<header id="bar">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="1.5"/><path d="M8 6.5h8M8 10h8M8 13.5h8M8 17h5"/></svg><div><b>Rack Designer</b><small id="projname"></small></div></div>
  <div class="acts">
    <button class="tb" id="b-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="tb" id="b-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep"></span>
    <button class="tb txt wide" id="b-new">New</button>
    <button class="tb txt wide" id="b-open">Open file</button>
    <button class="tb txt wide" id="b-save">Save file</button>
    <div class="menu-wrap">
      <button class="tb txt pri" id="b-export" aria-haspopup="true">Export <svg viewBox="0 0 24 24" class="chev"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="m-export" hidden>
        <div class="mh">Port allocation table</div>
        <button data-x="xlsx">Excel workbook (.xlsx)</button>
        <button data-x="csv">CSV (.csv)</button>
        <button data-x="pdf">PDF: rack layouts and port tables</button>
        <div class="mh">Rack layout picture</div>
        <button data-x="png">This rack as PNG</button>
        <button data-x="svg">This rack as SVG</button>
        <button data-x="pngall">All racks side by side (PNG)</button>
        <button data-x="pdfrack">This rack as PDF (picture only)</button>
        <label class="mchk"><input type="checkbox" id="x-free"> Include free ports in tables</label>
      </div>
    </div>
    <div class="menu-wrap narrow">
      <button class="tb" id="b-more" title="File" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <div class="menu" id="m-more" hidden>
        <button data-m="new">New project</button>
        <button data-m="open">Open file</button>
        <button data-m="save">Save file</button>
        <button data-m="theme">Light or dark</button>
      </div>
    </div>
    <button class="tb wide" id="b-theme" title="Light or dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </div>
  <input type="file" id="f-open" accept=".json,.rack.json,application/json" hidden>
</header>
<div id="app">
  <aside id="lib">
    <div class="ph libhead">Rack kit<button class="tb" id="lib-x" title="Close">✕</button></div>
    <p class="note">Drag onto a U, or click to add it in the lowest free space.</p>
    <input type="search" id="lib-q" placeholder="Search kit" aria-label="Search kit">
    <div id="lib-list"></div>
  </aside>
  <section id="mid">
    <div id="tabs"></div>
    <div id="tools"></div>
    <div id="stage"></div>
    <div id="table" hidden></div>
  </section>
  <aside id="panel"><div id="sheethead"><span class="grab"></span><button class="tb" id="sheet-x">Close</button></div><div id="pbody"></div></aside>
  <div id="scrim"></div>
</div>
<nav id="nav">
  <button data-pane="kit"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add kit</button>
  <button data-pane="rack"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 7.5h8M8 11h8M8 14.5h8"/></svg>Rack</button>
  <button data-pane="table"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>Ports</button>
  <button data-pane="details"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.6v.4"/></svg>Details</button>
</nav>
<div id="tip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/*@JSPDF@*/</script>
<script>
const FONT_CSS = /*@FONTS@*/;
/*@APP@*/
</script>
</body>
</html>
